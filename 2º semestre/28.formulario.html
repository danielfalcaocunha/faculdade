<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Cliente</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f7fb;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 520px;
            margin: 0 auto;
            padding: 24px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.08);
        }
        h1 {
            margin-top: 0;
            color: #1c3f6d;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 16px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 1rem;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #1c7ed6;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
        }
        button:hover {
            background: #1864ab;
        }
        .info {
            margin-top: 16px;
            font-size: 0.95rem;
        }
        .message {
            margin-bottom: 16px;
            padding: 12px;
            border-radius: 6px;
            background: #ffe8cc;
            color: #7b4e00;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Cadastro de Cliente</h1>
        <p>Preencha os dados abaixo para cadastrar um novo cliente no banco de dados.</p>

        <form id="clienteForm" action="28.cadastro.php" method="post" novalidate>
            <label for="nome_cliente">Nome completo</label>
            <input type="text" id="nome_cliente" name="nome_cliente" required maxlength="120" placeholder="Digite o nome" />

            <label for="cpf_cliente">CPF</label>
            <input type="text" id="cpf_cliente" name="cpf_cliente" required maxlength="14" placeholder="000.000.000-00" />

            <label for="email_cliente">E-mail</label>
            <input type="email" id="email_cliente" name="email_cliente" required maxlength="150" placeholder="email@exemplo.com" />

            <button type="submit">Cadastrar Cliente</button>
        </form>

        <div class="info">
            <p>Depois do cadastro, use <a href="28.leitura.php">28.leitura.php</a> para ver os clientes cadastrados.</p>
        </div>
    </div>

    <script>
        const cpfInput = document.getElementById('cpf_cliente');
        const form = document.getElementById('clienteForm');

        cpfInput.addEventListener('input', () => {
            let digits = cpfInput.value.replace(/\D/g, '');
            if (digits.length > 11) digits = digits.slice(0, 11);
            digits = digits.replace(/(\d{3})(\d)/, '$1.$2');
            digits = digits.replace(/(\d{3})\.(\d{3})(\d)/, '$1.$2.$3');
            digits = digits.replace(/(\d{3})\.(\d{3})\.(\d{3})(\d)/, '$1.$2.$3-$4');
            cpfInput.value = digits;
        });

        form.addEventListener('submit', (event) => {
            const nome = document.getElementById('nome_cliente').value.trim();
            const cpf = document.getElementById('cpf_cliente').value.replace(/\D/g, '');
            const email = document.getElementById('email_cliente').value.trim();
            const emailValido = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (!nome || !cpf || !email) {
                event.preventDefault();
                alert('Preencha todos os campos antes de enviar.');
                return;
            }
            if (cpf.length !== 11) {
                event.preventDefault();
                alert('Informe um CPF válido com 11 dígitos.');
                return;
            }
            if (!emailValido.test(email)) {
                event.preventDefault();
                alert('Informe um e-mail válido.');
            }
        });
    </script>
</body>
</html>
